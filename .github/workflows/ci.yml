name: CI

# Every push to main and every pull request must compile and pass the Box suite.
on:
  push:
    branches: [main]
  pull_request:

# Read-only token. This workflow needs no repository secrets: the fast Box job remains
# fully offline, while the Mongo-backed job uses only its pinned local service container.
# Broker credentials, Redis, and market access are never required.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + Box tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned major: the backend targets Node 22 (see @types/node) and uses
          # node:test, which is stable there.
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: |
          # Prefer a strict, reproducible install. The committed package-lock.json
          # is currently OUT OF SYNC with package.json — it pins @types/node@26
          # against ^22.10.0 and omits mongoose's whole dependency tree — so
          # `npm ci` correctly refuses. The deploy script uses `npm i`, which
          # tolerates the drift, which is why it went unnoticed.
          #
          # Fall back to `npm install` so CI still verifies the typecheck, build and
          # tests, and warn loudly. Regenerate the lockfile locally
          # (`npm install` && commit package-lock.json) and this step goes back to a
          # strict `npm ci` on its own, with no workflow change needed.
          npm ci || {
            echo "::warning title=Lockfile out of sync::npm ci refused: package-lock.json does not match package.json. Falling back to 'npm install'. Please run 'npm install' locally and commit the regenerated package-lock.json."
            npm install --no-audit --no-fund
          }

      - name: Typecheck
        run: npm run typecheck

      # `npm test` runs `npm run build` first (see package.json), so the BUILD is
      # exercised here rather than in a third redundant `tsc -b` invocation:
      #   build === typecheck === `tsc -b`, and test = build + node --test.
      # Steps run in order and fail fast, so a type error stops the job above.
      - name: Build + test
        run: npm test


  mongo-test:
    name: Typecheck + Box tests (MongoDB)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0.14
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      BOX_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/calspread_box_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: |
          npm ci || {
            echo "::warning title=Lockfile out of sync::npm ci refused: package-lock.json does not match package.json. Falling back to 'npm install'. Please run 'npm install' locally and commit the regenerated package-lock.json."
            npm install --no-audit --no-fund
          }

      - name: Typecheck
        run: npm run typecheck

      # The environment variable activates the production Mongo CAS, physical-legacy,
      # aggregation-pipeline, and recovery-index tests that the offline job intentionally skips.
      - name: Build + test with MongoDB
        run: npm test
