name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build, vet, race and PostgreSQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_USER: calspread
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: calspread_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calspread -d calspread_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://calspread:local-ci-only@127.0.0.1:5432/calspread_test?sslmode=disable
      REQUIRE_DB_TESTS: '1'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Locked dependency download
        run: go mod download
      - name: Build, vet, formatting and required database/race checks
        run: bash scripts/check.sh
      - name: Module files remain in sync
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Build the standalone local server
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: calspread-linux-amd64
          path: outputs/calspread
          if-no-files-found: error
