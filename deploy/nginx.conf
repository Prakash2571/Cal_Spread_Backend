server {
    listen 80;
    listen [::]:80;
    server_name calspread.online www.calspread.online;
    access_log /var/log/nginx/calspread.access.log calspread_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://calspread.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.calspread.online;
    access_log /var/log/nginx/calspread.access.log calspread_safe;
    ssl_certificate /etc/letsencrypt/live/calspread.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calspread.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://calspread.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name calspread.online;

    ssl_certificate /etc/letsencrypt/live/calspread.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calspread.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CalSpreadSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/calspread;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Do not log query strings: login callbacks and SSE may carry credentials.
    access_log /var/log/nginx/calspread.access.log calspread_safe;
    error_log /var/log/nginx/calspread.error.log warn;

    location ~ /\. {
        deny all;
    }

    location ~ ^/(api(?:/|$)|login/?$|callback/?$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend trusts the first forwarded address; overwrite client input.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
}
