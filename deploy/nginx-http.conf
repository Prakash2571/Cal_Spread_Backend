# Bootstrap HTTP configuration; replace with nginx.conf after issuing the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name calspread.online www.calspread.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 503;
    }
}
